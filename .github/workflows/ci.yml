name: IntegraRP CI v1.44 — Fundação Verde

on:
  push:
    branches: [main, codex/**, feature/**]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: 8.0.x
  POSTGRES_URI: postgresql://integrarp:integrarp@localhost:5432/integrarp_ci

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: dotnet sln IntegraRP.sln list
      - run: bash -n scripts/*.sh
      - run: while IFS= read -r file; do node --check "$file"; done < <(find src/IntegraRP.Web/wwwroot -path '*/lib/*' -prune -o -name '*.js' -print)
      - run: python3 scripts/generate-scriptcompleto.py && cmp database/scriptcompleto.sql database/script_completop.sql

  manifest-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet run --project tools/IntegraRP.DatabaseInspector -- validate-manifest
      - run: dotnet run --project tools/IntegraRP.DatabaseInspector -- lint-schema-qualification

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh FullyQualifiedName~Architecture architecture
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: architecture-trx, path: artifacts/test-results }

  dotnet-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: dotnet format IntegraRP.sln --verify-no-changes --no-restore
      - run: dotnet build IntegraRP.sln --configuration Release --no-restore
      - run: dotnet test IntegraRP.sln --configuration Release --no-build --logger "trx;LogFileName=dotnet-linux.trx"

  dotnet-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: dotnet build IntegraRP.sln --configuration Release --no-restore
      - run: dotnet test IntegraRP.sln --configuration Release --no-build --logger "trx;LogFileName=dotnet-windows.trx"

  warnings-as-errors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: dotnet build IntegraRP.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true

  razor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet build src/IntegraRP.Web/IntegraRP.Web.csproj --configuration Release

  bootstrap-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: test -s src/IntegraRP.Web/wwwroot/lib/bootstrap/css/bootstrap.min.css
      - run: test -s src/IntegraRP.Web/wwwroot/lib/bootstrap/js/bootstrap.bundle.min.js
      - run: test -s src/IntegraRP.Web/wwwroot/lib/bootstrap-icons/font/bootstrap-icons.css
      - run: rg -q "Bootstrap v5" src/IntegraRP.Web/wwwroot/lib/bootstrap/css/bootstrap.min.css
      - run: test -f src/IntegraRP.Web/wwwroot/lib/bootstrap/LICENSE && test -f src/IntegraRP.Web/wwwroot/lib/bootstrap-icons/LICENSE.md

  database-clean:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: integrarp, POSTGRES_PASSWORD: integrarp, POSTGRES_DB: integrarp_ci }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U integrarp -d integrarp_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - run: psql -X "$POSTGRES_URI" -v ON_ERROR_STOP=1 -f database/scriptcompleto.sql
      - run: psql -X "$POSTGRES_URI" -v ON_ERROR_STOP=1 -f database/validate_scriptcompleto.sql

  database-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: integrarp, POSTGRES_PASSWORD: integrarp, POSTGRES_DB: integrarp_ci }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U integrarp -d integrarp_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - run: for f in database/migrations/*.sql; do [[ "$f" > database/migrations/0045_v139_release_candidate_piloto.sql ]] && break; psql -X "$POSTGRES_URI" -v ON_ERROR_STOP=1 -f "$f"; done
      - run: psql -X "$POSTGRES_URI" -v ON_ERROR_STOP=1 -f database/migrations/0045_v139_release_candidate_piloto.sql
      - run: psql -X "$POSTGRES_URI" -v ON_ERROR_STOP=1 -f database/scriptcompleto.sql
      - run: psql -X "$POSTGRES_URI" -v ON_ERROR_STOP=1 -f database/validate_scriptcompleto.sql

  database-idempotency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: integrarp, POSTGRES_PASSWORD: integrarp, POSTGRES_DB: integrarp_ci }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U integrarp -d integrarp_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - run: psql -X "$POSTGRES_URI" -v ON_ERROR_STOP=1 -f database/scriptcompleto.sql
      - run: pg_dump "$POSTGRES_URI" --schema-only --no-owner --no-privileges > /tmp/schema-1.sql
      - run: psql -X "$POSTGRES_URI" -v ON_ERROR_STOP=1 -f database/scriptcompleto.sql
      - run: pg_dump "$POSTGRES_URI" --schema-only --no-owner --no-privileges > /tmp/schema-2.sql && cmp /tmp/schema-1.sql /tmp/schema-2.sql
      - run: psql -X "$POSTGRES_URI" -v ON_ERROR_STOP=1 -f database/scriptcompleto.sql
      - run: psql -X "$POSTGRES_URI" -v ON_ERROR_STOP=1 -f database/validate_scriptcompleto.sql

  database-preservation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: integrarp, POSTGRES_PASSWORD: integrarp, POSTGRES_DB: integrarp_ci }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U integrarp -d integrarp_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - run: psql -X "$POSTGRES_URI" -v ON_ERROR_STOP=1 -f database/scriptcompleto.sql
      - run: psql -X "$POSTGRES_URI" -v ON_ERROR_STOP=1 -c "insert into integrarp.tenant(id,nome,codigo,status) values('14000000-0000-0000-0000-000000000001','Tenant preservação v1.40','preservation-v140','ativo')"
      - run: psql -X "$POSTGRES_URI" -Atc "select count(*) || ':' || md5(string_agg(row_to_json(t)::text, '' order by id)) from integrarp.tenant t" > /tmp/before
      - run: psql -X "$POSTGRES_URI" -v ON_ERROR_STOP=1 -f database/scriptcompleto.sql
      - run: psql -X "$POSTGRES_URI" -Atc "select count(*) || ':' || md5(string_agg(row_to_json(t)::text, '' order by id)) from integrarp.tenant t" > /tmp/after
      - run: cmp /tmp/before /tmp/after
      - run: psql -X "$POSTGRES_URI" -v ON_ERROR_STOP=1 -f database/validate_scriptcompleto.sql

  migration-runner-real:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: integrarp, POSTGRES_PASSWORD: integrarp, POSTGRES_DB: integrarp_ci }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U integrarp -d integrarp_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet run --project src/IntegraRP.Api --no-launch-profile & echo $! > /tmp/api.pid; sleep 20; kill $(cat /tmp/api.pid) || true
        env: { ConnectionStrings__DefaultConnection: '${{ env.POSTGRES_URI }}', Database__RunMigrationsOnStartup: 'true' }
      - run: test "$(psql -X "$POSTGRES_URI" -Atc 'select count(*) from integrarp.schema_migrations where success')" -gt 0
      - run: dotnet run --project src/IntegraRP.Api --no-launch-profile & echo $! > /tmp/api.pid; sleep 12; kill $(cat /tmp/api.pid) || true
        env: { ConnectionStrings__DefaultConnection: '${{ env.POSTGRES_URI }}', Database__RunMigrationsOnStartup: 'true' }

  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Auth" auth
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: auth-trx, path: artifacts/test-results }

  onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Onboarding" onboarding
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: onboarding-trx, path: artifacts/test-results }

  notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Notification" notifications
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: notifications-trx, path: artifacts/test-results }

  customers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Customer|FullyQualifiedName~Document" customers
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: customers-trx, path: artifacts/test-results }

  products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Product|FullyQualifiedName~Categor" products
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: products-trx, path: artifacts/test-results }

  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Inventory|FullyQualifiedName~Allocation|FullyQualifiedName~Stock" inventory
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: inventory-trx, path: artifacts/test-results }

  orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Order|FullyQualifiedName~Pricing|FullyQualifiedName~Discount" orders
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: orders-trx, path: artifacts/test-results }

  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Process|FullyQualifiedName~Journey" process
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: process-trx, path: artifacts/test-results }

  tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Task|FullyQualifiedName~Checklist" tasks
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: tasks-trx, path: artifacts/test-results }

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Evidence|FullyQualifiedName~Attachment" evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: evidence-trx, path: artifacts/test-results }

  billing-pending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Billing|FullyQualifiedName~Faturamento" billing-pending
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: billing-pending-trx, path: artifacts/test-results }

  audit-outbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Audit|FullyQualifiedName~Outbox" audit-outbox
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: audit-outbox-trx, path: artifacts/test-results }

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Worker|FullyQualifiedName~Handler|FullyQualifiedName~Retry" worker
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: worker-trx, path: artifacts/test-results }

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Dashboard|FullyQualifiedName~NextBestAction" dashboard
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dashboard-trx, path: artifacts/test-results }

  web-bff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Bff|FullyQualifiedName~ApiClient|FullyQualifiedName~Navigation" web-bff
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: web-bff-trx, path: artifacts/test-results }

  standalone-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: bash scripts/publish-standalone-linux.sh && bash scripts/test-standalone-linux.sh

  standalone-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - shell: pwsh
        run: ./scripts/publish-standalone-windows.ps1; ./scripts/test-standalone-windows.ps1

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh FullyQualifiedName~Playwright playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-artifacts, path: 'artifacts/test-results' }

  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -d tests && find tests -type f | grep -E 'Visual|Screenshot'

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: '! rg -n "alert\(|confirm\(|prompt\(|innerHTML" src/IntegraRP.Web/wwwroot --glob "*.js"'
      - run: rg -q 'aria-live' src/IntegraRP.Web/Views/Shared/_FeedbackHost.cshtml

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/IntegraRP.Mobile/package-lock.json }
      - working-directory: apps/IntegraRP.Mobile
        run: npm ci && npm run typecheck && npm test --if-present

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet list IntegraRP.sln package --vulnerable --include-transitive
      - run: '! rg -n "alert\(|confirm\(|prompt\(|innerHTML" src/IntegraRP.Web/wwwroot --glob "*.js"'

  schema-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate-scriptcompleto.py
      - run: python3 -m json.tool database/schema_inventory.json > /dev/null

  schema-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet run --project tools/IntegraRP.DatabaseInspector -- lint-schema-qualification

  generator-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate-scriptcompleto.py && sha256sum database/scriptcompleto.sql > /tmp/first
      - run: python3 scripts/generate-scriptcompleto.py && sha256sum database/scriptcompleto.sql > /tmp/second
      - run: cmp /tmp/first /tmp/second && cmp database/scriptcompleto.sql database/script_completop.sql

  database-object-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: integrarp, POSTGRES_PASSWORD: integrarp, POSTGRES_DB: integrarp_ci }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U integrarp -d integrarp_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - run: psql -X "$POSTGRES_URI" --set ON_ERROR_STOP=1 --file database/scriptcompleto.sql
      - run: psql -X "$POSTGRES_URI" --set ON_ERROR_STOP=1 --file database/validate_scriptcompleto.sql

  database-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate-scriptcompleto.py
      - run: '! rg -n "CREATE[[:space:]]+INDEX[[:space:]]+CONCURRENTLY|DROP[[:space:]]+CASCADE|EXCEPTION[[:space:]]+WHEN[[:space:]]+OTHERS" database/scriptcompleto.sql database/migrations/0046_v140_scriptcompleto_integrarp.sql'


  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: dotnet format IntegraRP.sln --verify-no-changes --no-restore

  schema-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m json.tool database/schema_contract.json > /dev/null
      - run: python3 -m json.tool database/schema_inventory.json > /dev/null

  commercial-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Customer|FullyQualifiedName~Product|FullyQualifiedName~Inventory|FullyQualifiedName~Order" commercial-domain

  commercial-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~CommercialJourney|FullyQualifiedName~ApiContract" commercial-api

  outbox-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~Outbox|FullyQualifiedName~Worker|FullyQualifiedName~Handler" outbox-worker

  runtime-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: integrarp, POSTGRES_PASSWORD: integrarp, POSTGRES_DB: integrarp_ci }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U integrarp -d integrarp_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: psql -X "$POSTGRES_URI" -v ON_ERROR_STOP=1 -f database/scriptcompleto.sql
      - run: dotnet restore IntegraRP.sln
      - run: scripts/run-filtered-tests.sh "FullyQualifiedName~RuntimeSmoke|FullyQualifiedName~CommercialJourney" runtime-smoke
        env: { ConnectionStrings__DefaultConnection: '${{ env.POSTGRES_URI }}' }

  release-gate:
    runs-on: ubuntu-latest
    if: always()
    needs: [syntax, format, manifest-validation, schema-contract, schema-inventory, schema-qualification, generator-determinism, dotnet-linux, dotnet-windows, warnings-as-errors, razor, bootstrap-contract, database-clean, database-idempotency, database-upgrade, database-preservation, migration-runner-real, database-object-validation, commercial-domain, commercial-api, web-bff, outbox-worker, runtime-smoke, playwright, accessibility, visual-regression, standalone-linux, standalone-windows, security]
    steps:
      - name: Exigir todos os checks obrigatórios verdes
        env:
          RESULTS: '${{ toJSON(needs) }}'
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  diagnostic-artifacts:
    runs-on: ubuntu-latest
    if: always()
    needs: [release-gate]
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p artifacts/v144/database && cp database/scriptcompleto.sql database/script_completop.sql database/validate_scriptcompleto.sql database/validate_script_completop.sql database/schema_inventory.json database/migration_manifest.json artifacts/v144/database/
      - uses: actions/upload-artifact@v4
        with: { name: "v144-diagnostic-${{ github.run_id }}", path: artifacts/v143, retention-days: 30 }
