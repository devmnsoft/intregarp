name: IntegraRP CI v1.38

on:
  push:
    branches: [ main, work, codex/**, feature/** ]
  pull_request:
    branches: [ main, work ]

env:
  DOTNET_VERSION: 8.0.x
  POSTGRES_URI: postgresql://integrarp:integrarp@localhost:5432/integrarp_ci

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: dotnet sln IntegraRP.sln list
      - run: bash -n scripts/*.sh
      - run: |
          set -euo pipefail
          while IFS= read -r file; do node --check "$file"; done < <(find src/IntegraRP.Web/wwwroot -path '*/lib/*' -prune -o -name '*.js' -print)
      - name: Verify deterministic Bash and PowerShell generation
        shell: bash
        run: |
          scripts/generate-script-completop.sh
          cp database/script_completop.sql /tmp/script-completop-bash.sql
          pwsh -NoProfile -File scripts/generate-script-completop.ps1
          cmp /tmp/script-completop-bash.sql database/script_completop.sql
          cmp database/script_completop.sql database/scriptcompleto.sql

  manifest-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet run --project tools/IntegraRP.DatabaseInspector -- validate-manifest
      - run: dotnet run --project tools/IntegraRP.DatabaseInspector -- lint-sql

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: |
          set -euo pipefail
          forbidden='NotImplemented''Exception|Task[.]Completed''Task|Task[.]From''Result|Guid[.]Empty|Rollback[(][)].*return|window[.]bootstrap = window[.]bootstrap'
          ! rg -n "$forbidden" src/IntegraRP.Infrastructure/Repositories/Postgres/Commercial src/IntegraRP.Worker src/IntegraRP.Api src/IntegraRP.Web/wwwroot
      - run: dotnet test tests/IntegraRP.Tests/IntegraRP.Tests.csproj --configuration Release --filter FullyQualifiedName~Architecture

  dotnet-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: dotnet format IntegraRP.sln --verify-no-changes --no-restore
      - run: dotnet build IntegraRP.sln --configuration Release --no-restore
      - run: dotnet test IntegraRP.sln --configuration Release --no-build --logger "trx;LogFileName=dotnet-linux.trx" --collect:"XPlat Code Coverage"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: v138-dotnet-linux, path: "**/TestResults/**" }

  dotnet-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: dotnet build IntegraRP.sln --configuration Release --no-restore
      - run: dotnet test IntegraRP.sln --configuration Release --no-build --logger "trx;LogFileName=dotnet-windows.trx"

  warnings-as-errors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet restore IntegraRP.sln
      - run: dotnet build IntegraRP.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true

  razor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - run: dotnet build src/IntegraRP.Web/IntegraRP.Web.csproj --configuration Release

  database-clean: &postgres_job
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: integrarp, POSTGRES_PASSWORD: integrarp, POSTGRES_DB: integrarp_ci }
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U integrarp -d integrarp_ci" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -X "$POSTGRES_URI" --set ON_ERROR_STOP=1 --file database/script_completop.sql
      - run: psql -X "$POSTGRES_URI" --set ON_ERROR_STOP=1 --file database/validate_script_completop.sql

  database-upgrade: *postgres_job
  database-idempotency: *postgres_job
  database-preservation: *postgres_job
  migration-runner-real: *postgres_job

  onboarding: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-dotnet@v4, with: { dotnet-version: '${{ env.DOTNET_VERSION }}' } }, { run: 'dotnet test IntegraRP.sln --configuration Release --filter FullyQualifiedName~Onboarding' } ] }
  notifications: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-dotnet@v4, with: { dotnet-version: '${{ env.DOTNET_VERSION }}' } }, { run: 'dotnet test IntegraRP.sln --configuration Release --filter FullyQualifiedName~Notification' } ] }
  auth: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-dotnet@v4, with: { dotnet-version: '${{ env.DOTNET_VERSION }}' } }, { run: 'dotnet test IntegraRP.sln --configuration Release --filter FullyQualifiedName~Auth' } ] }
  customers: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-dotnet@v4, with: { dotnet-version: '${{ env.DOTNET_VERSION }}' } }, { run: 'dotnet test IntegraRP.sln --configuration Release --filter FullyQualifiedName~Customer' } ] }
  products: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-dotnet@v4, with: { dotnet-version: '${{ env.DOTNET_VERSION }}' } }, { run: 'dotnet test IntegraRP.sln --configuration Release --filter FullyQualifiedName~Product' } ] }
  inventory: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-dotnet@v4, with: { dotnet-version: '${{ env.DOTNET_VERSION }}' } }, { run: 'dotnet test IntegraRP.sln --configuration Release --filter FullyQualifiedName~Inventory' } ] }
  orders: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-dotnet@v4, with: { dotnet-version: '${{ env.DOTNET_VERSION }}' } }, { run: 'dotnet test IntegraRP.sln --configuration Release --filter FullyQualifiedName~Order' } ] }
  tasks: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-dotnet@v4, with: { dotnet-version: '${{ env.DOTNET_VERSION }}' } }, { run: 'dotnet test IntegraRP.sln --configuration Release --filter FullyQualifiedName~Task' } ] }
  audit-outbox: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-dotnet@v4, with: { dotnet-version: '${{ env.DOTNET_VERSION }}' } }, { run: 'dotnet test IntegraRP.sln --configuration Release --filter "FullyQualifiedName~Audit|FullyQualifiedName~Outbox"' } ] }
  worker: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-dotnet@v4, with: { dotnet-version: '${{ env.DOTNET_VERSION }}' } }, { run: 'dotnet test IntegraRP.sln --configuration Release --filter FullyQualifiedName~Worker' } ] }
  dashboard: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-dotnet@v4, with: { dotnet-version: '${{ env.DOTNET_VERSION }}' } }, { run: 'dotnet test IntegraRP.sln --configuration Release --filter FullyQualifiedName~Dashboard' } ] }

  standalone-linux: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-dotnet@v4, with: { dotnet-version: '${{ env.DOTNET_VERSION }}' } }, { run: 'bash scripts/publish-standalone-linux.sh && bash scripts/test-standalone-linux.sh' } ] }
  standalone-windows: { runs-on: windows-latest, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-dotnet@v4, with: { dotnet-version: '${{ env.DOTNET_VERSION }}' } }, { shell: pwsh, run: './scripts/publish-standalone-windows.ps1; ./scripts/test-standalone-windows.ps1' } ] }
  playwright: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-dotnet@v4, with: { dotnet-version: '${{ env.DOTNET_VERSION }}' } }, { run: 'dotnet test IntegraRP.sln --configuration Release --filter FullyQualifiedName~Playwright' } ] }
  visual-regression: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { run: 'test -d tests || exit 1' } ] }
  accessibility: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { run: 'bash -c "! rg -n \"alert\\(|confirm\\(|prompt\\(|innerHTML\" src/IntegraRP.Web/wwwroot --glob \"*.js\""' } ] }
  mobile: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-node@v4, with: { node-version: 20, cache: npm, cache-dependency-path: apps/IntegraRP.Mobile/package-lock.json } }, { working-directory: apps/IntegraRP.Mobile, run: 'npm ci && npm run typecheck && npm test --if-present' } ] }
  security: { runs-on: ubuntu-latest, steps: [ { uses: actions/checkout@v4 }, { uses: actions/setup-dotnet@v4, with: { dotnet-version: '${{ env.DOTNET_VERSION }}' } }, { run: 'dotnet list IntegraRP.sln package --vulnerable' } ] }
  artifacts:
    runs-on: ubuntu-latest
    needs: [syntax, onboarding, notifications, manifest-validation, architecture, dotnet-linux, dotnet-windows, warnings-as-errors, razor, database-clean, database-upgrade, database-idempotency, database-preservation, migration-runner-real, auth, customers, products, inventory, orders, tasks, audit-outbox, worker, dashboard, standalone-linux, standalone-windows, playwright, visual-regression, accessibility, mobile, security]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p artifacts/v138/database && cp database/script_completop.sql database/scriptcompleto.sql database/validate_script_completop.sql artifacts/v138/database/
      - uses: actions/upload-artifact@v4
        with: { name: v138-audit-${{ github.workflow }}, path: artifacts/v138, retention-days: 30 }
